name: site

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - tekoa-updated
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  pull_request:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/site.yml"

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  ELIXIR_VERSION: "1.20.0"
  OTP_VERSION: "28"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Checkout Tekoá
        uses: actions/checkout@v4
        with:
          repository: taina-labs/tekoa
          ref: main
          path: .tekoa

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Test builder
        run: elixir site/build_test.exs

      - name: Build public site
        run: elixir site/build.exs --tekoa .tekoa --output site/_build

      - name: Save build
        uses: actions/upload-artifact@v4
        with:
          name: public-site
          path: site/_build
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: public-site
          path: site/_build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_build

      - id: deployment
        uses: actions/deploy-pages@v4
