name: docker smoke

# Verifica que a imagem de produção sobe de verdade, já no regime do SQLite.
#
# O CI (ci.yml) roda os testes contra o código compilado no runner, num SQLite
# de teste efêmero. Isso não pega o que quebra na hora de instalar numa caixa:
# diretório que o release cria sem dono, variável de ambiente faltando no
# runtime, migração que não roda no boot. Esses problemas só aparecem quando o
# container sobe.
#
# Um caso concreto: o Dockerfile criava /app/storage com o dono correto mas não
# /app/backups. O volume de backup nascia root-owned, o processo rodava como
# nobody, e o backup agendado falhava com :eacces registrando só "Backup
# falhou". Nenhum teste pegou isso, porque nenhum teste subia o container.
#
# O que este job faz, espelhando o deployment Compose do Oka: sobe o release
# conectado a um arquivo SQLite num volume montado,
# deixa as migrações rodarem no boot, bootstrapa a comunidade sem interface
# (headless), loga pela interface e confere que os volumes são graváveis. O
# isolamento entre comunidades é coberto pela tripwire de aplicação
# (test/taina/isolation_sweep_test.exs), não aqui: não existe mais banco de
# dados externo com papel e RLS para provar.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Um job só, um runner só: a imagem fica no daemon local (buildx com load:
# true) e o smoke sobe o container a partir dela. Separar em dois jobs nunca
# funcionou — o segundo runner não recebia a imagem carregada no primeiro.
jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # load: true deixa a imagem no daemon do runner em vez de só no registry,
      # que é o que permite subir o container a partir dela no mesmo job.
      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: taina:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the release's own start command
        run: |
          # The release reads one strict configuration file. bin/server creates
          # the persistent secret, runs migrations and only then starts Phoenix.
          cat > taina-smoke.conf <<'EOF'
          url_scheme = http
          hostname = localhost
          url_port = 4000
          bind_ip = 0.0.0.0
          port = 4000
          data_dir = /app/data
          storage_dir = /app/storage
          backup_dir = /app/backups
          backup_enabled = false
          update_check = false
          EOF

          docker run -d --name smoke_app \
            -e TAINA_CONFIG=/app/taina.conf \
            -v "$PWD/taina-smoke.conf:/app/taina.conf:ro" \
            -v taina_smoke_data:/app/data \
            -v taina_smoke_storage:/app/storage \
            -v taina_smoke_backups:/app/backups \
            taina:smoke

      - name: Wait for the app to report healthy
        run: |
          # De dentro do container, porque a porta 4000 não é publicada e o
          # /health só responde 200 quando o banco
          # (o arquivo SQLite) também respondeu.
          for i in $(seq 1 60); do
            if docker exec smoke_app curl -fsS http://localhost:4000/health; then
              echo ""
              echo "app saudável"
              exit 0
            fi
            sleep 5
          done
          echo "o app não ficou saudável a tempo"
          docker logs smoke_app
          exit 1

      - name: Bootstrap the community headlessly
        run: |
          # Mesma chamada que a tela de primeiro acesso faz, mas sem
          # interface: prova que o caminho de bootstrap funciona no container,
          # contra o arquivo SQLite do volume.
          #
          # eval não sobe a aplicação, então o Repo não estaria de pé e
          # bootstrap explodiria com "could not lookup Ecto repo". Subimos só
          # o Repo aqui; a chamada então roda igual à do request web. O migrate
          # do boot funciona pelo mesmo motivo: Ecto.Migrator.with_repo sobe o
          # Repo antes de migrar.
          docker exec smoke_app /app/bin/taina eval '
            {:ok, _} = Application.ensure_all_started(:ecto_sqlite3)
            {:ok, _} = Taina.Repo.start_link()
            {:ok, %{tekoa: _}} = Taina.Maraca.bootstrap(%{name: "Smoke Tekoa", storage_quota_bytes: 1073741824}, %{username: "smoke", display_name: "Smoke", password: "smoke-pass-123", password_confirmation: "smoke-pass-123"})
          '
          echo "bootstrap headless OK"

      - name: Login and load an authenticated page
        run: |
          # Prova o fluxo de sessão ponta a ponta, via HTTP: resolução de
          # sessão do login e a home autenticada consultam o banco com o
          # contexto de Tekoa. O form de login é um POST tradicional com o
          # token CSRF da própria página (o Plug guarda o estado na sessão,
          # que vai no cookie), então o fluxo inteiro funciona com curl.
          docker exec smoke_app curl -fsS -c /tmp/smoke-jar http://localhost:4000/login > login.html
          csrf=$(sed -n 's/.*name="_csrf_token" value="\([^"]*\)".*/\1/p' login.html)
          [ -n "$csrf" ] || { echo "token CSRF não apareceu na página de login"; exit 1; }

          docker exec smoke_app curl -fsS -o /dev/null -b /tmp/smoke-jar -c /tmp/smoke-jar \
            --data-urlencode "_csrf_token=$csrf" \
            --data-urlencode "username=smoke" \
            --data-urlencode "password=smoke-pass-123" \
            http://localhost:4000/login

          home=$(docker exec smoke_app curl -fsS -b /tmp/smoke-jar http://localhost:4000/)
          printf '%s' "$home" | grep -q "Smoke Tekoa" \
            || { echo "home autenticada não renderizou a comunidade (login falhou?)"; exit 1; }
          echo "login OK, home autenticada respondeu"

      - name: The volumes must be writable by the runtime user
        run: |
          # O container roda como nobody. Se um diretório de dados nascer
          # root-owned no volume, o app sobe e só falha na hora de escrever, que
          # é o pior jeito de falhar: saúde no healthcheck, erro no backup das
          # quatro da manhã. Checamos os três caminhos de escrita antes de
          # declarar o job verde: o banco (SQLite), o storage e os backups.
          docker exec smoke_app sh -c 'touch /app/data/.probe && rm /app/data/.probe' \
            || { echo "app/data não é gravável pelo nobody"; exit 1; }
          docker exec smoke_app sh -c 'touch /app/storage/.probe && rm /app/storage/.probe' \
            || { echo "app/storage não é gravável pelo nobody"; exit 1; }
          docker exec smoke_app sh -c 'touch /app/backups/.probe && rm /app/backups/.probe' \
            || { echo "app/backups não é gravável pelo nobody"; exit 1; }
          echo "data, storage e backups graváveis"

      - name: Logs when it fails
        if: failure()
        run: |
          docker logs smoke_app 2>&1 || true

      - name: Clean up
        if: always()
        run: |
          docker rm -f smoke_app 2>/dev/null || true
          docker volume rm -f taina_smoke_data taina_smoke_storage taina_smoke_backups 2>/dev/null || true
          rm -f taina-smoke.conf login.html
