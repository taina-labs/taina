name: okena

on:
  pull_request:
    paths:
      - "okena/**"
      - "api/**"
      - "priv/static/openapi.yaml"
      - ".github/workflows/okena.yml"
  push:
    branches:
      - main
    paths:
      - "okena/**"
      - "api/**"
      - "priv/static/openapi.yaml"
      - ".github/workflows/okena.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Check shared contract links
        run: |
          test -f okena/api/openapi.yaml
          test -f okena/design/tokens.css

      - name: Check the Dart core
        working-directory: okena/packages/okena_core
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Check the Flutter app
        working-directory: okena/app
        run: |
          flutter pub get
          flutter analyze
          flutter test
