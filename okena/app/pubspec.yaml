name: okena_app
description: Tainá's multiplatform app.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  background_downloader: ^9.6.6
  crypto: ^3.0.8
  # 13.4.0 pulls android_file_picker 2.2.0, which does not compile.
  file_picker: 13.3.2
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.5.0
  go_router: ^18.1.3
  image_picker: ^1.2.4
  material_ui: ^1.11.1
  mobile_scanner: ^7.5.0
  okena_core:
    path: ../packages/okena_core
  open_filex: ^5.0.0
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  photo_manager: ^3.12.0
  provider: ^6.1.5+1
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  # 2.2.0 references LostDataStore symbols absent from file_picker 13.x.
  android_file_picker: 2.1.4

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/icons/
  fonts:
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Variable.ttf
    - family: Schibsted Grotesk
      fonts:
        - asset: assets/fonts/SchibstedGrotesk-Variable.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
