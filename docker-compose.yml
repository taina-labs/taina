# Compose v2 (this repo's stack, and what CI's Docker builds assume). The
# obsolete `version:` key is deliberately absent: Compose v2 warns about it and
# ignores it.
#
# For a real box use oka instead: it adds Caddy for HTTPS and only exposes one
# port. This file exists for local development.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Database: a SQLite file on a volume (see config/runtime.exs).
      DATABASE_PATH: /app/data/taina.db

      # Phoenix
      PHX_HOST: localhost
      PHX_SERVER: "true"
      SECRET_KEY_BASE: "change_me_in_production_please_generate_with_mix_phx_gen_secret"

      # Ports
      PORT: 4000

      # Storage (Ybira file uploads) — must match the var read in
      # config/runtime.exs (`STORAGE_ROOT`), or uploads silently fall back to
      # the default path.
      STORAGE_ROOT: /app/storage

      # Backup (Nhaman) — off by default; set to "true" to enable the scheduled
      # SQLite snapshot plus storage archive written under BACKUP_DIR.
      BACKUP_ENABLED: "false"
      BACKUP_DIR: /app/backups
    ports:
      - "4000:4000"
    volumes:
      # Mount the database file's directory (persistent across restarts)
      - data_data:/app/data

      # Mount storage for file uploads (persistent across restarts)
      - storage_data:/app/storage

      # Backups land here; mount a host disk/USB in production instead.
      - backups_data:/app/backups

      # Development: mount code for live reloading (comment out for production)
      # - .:/app
      # - /app/_build
      # - /app/deps
      # - /app/assets/node_modules
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  data_data:
    driver: local
  storage_data:
    driver: local
  backups_data:
    driver: local

networks:
  default:
    name: taina_network
